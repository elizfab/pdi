@if (open) {
  <div class="modal-overlay" id="modalOverlay" (click)="onOverlayClick($event)">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button type="button" class="modal-close" (click)="onClose()" aria-label="Fechar detalhes">×</button>
      <div id="modalBody">
        <h3 id="modalTitle">{{ title }}</h3>
        <dl>
          @for (field of fields; track field.label) {
            <div>
              <dt>{{ field.label }}</dt>
              <dd>{{ field.value }}</dd>
            </div>
          }
        </dl>
      </div>
    </div>
  </div>
}
