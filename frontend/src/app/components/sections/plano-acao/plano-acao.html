<section id="plano-acao" class="section" aria-labelledby="planoAcaoTitle">
  <div class="section-inner">
    <p class="section-eyebrow">09 · Execução</p>
    <h2 id="planoAcaoTitle">O que preciso fazer agora?</h2>

    <pdi-filter-bar
      [options]="filters"
      [active]="filter"
      (filterChange)="onFilterChange($event)"
    ></pdi-filter-bar>

    <div class="table-wrap">
      <table class="data-table" id="planoAcaoTable">
        <thead>
          <tr>
            <th scope="col">Tarefa</th>
            <th scope="col">Categoria</th>
            <th scope="col">Prazo</th>
            <th scope="col">Prioridade</th>
            <th scope="col">Status</th>
            <th scope="col">Resultado esperado</th>
          </tr>
        </thead>
        <tbody id="planoAcaoBody">
          @for (t of filtered(); track $index) {
            <tr>
              <td>{{ t.tarefa }}</td>
              <td>{{ t.categoria }}</td>
              <td>{{ t.prazo }}</td>
              <td><span class="badge" [class]="priorityClass(t.prioridade)">{{ t.prioridade }}</span></td>
              <td><span class="status-pill" [style]="statusPillStyle(t.status)">{{ t.status }}</span></td>
              <td>{{ t.resultadoEsperado }}</td>
            </tr>
          } @empty {
            <tr><td colspan="6">Nenhuma tarefa neste status.</td></tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</section>
